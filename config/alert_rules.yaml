alerts:
  - name: high_tail_latency
    severity: warning
    condition: "latency_p95 > 3000ms"
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-1
  - name: api_error_rate_high
    severity: critical
    condition: "error_rate_pct > 2%"
    duration: 3m
    type: symptom-based
    channel: slack
    owner: oncall-engineer
    runbook: docs/alerts.md#alert-2
  - name: cost_spike_detected
    severity: warning
    condition: "cost_usd_per_min > 0.05"
    duration: 10m
    type: symptom-based
    channel: slack
    owner: platform-team
    runbook: docs/alerts.md#alert-3
